name: Data Dragon contract

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ddragon-contract
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install verifier dependencies
        run: >-
          python -m pip install
          "numpy>=2.1,<3"
          "opencv-python-headless>=4.10,<5"
          "requests>=2.31,<3"
      - name: Verify live VN Data Dragon contract
        run: python tools/verify_ddragon.py
